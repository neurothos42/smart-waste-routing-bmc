<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Berhampur Municipal Corporation - Login</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", sans-serif;
        background-image: url("{{ url_for('static', filename='images/login_bg_map.png') }}");
        background-repeat: no-repeat;
        backdrop-filter: blur(10px);
        background-position: center;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        color: #fff;
      }

      .container {
        width: 90%;
        max-width: 1200px;
        display: flex;
        background: #2e7d32;
        border-radius: 16px;
        overflow: hidden;
        flex-wrap: wrap;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      }

      .form-box,
      .map-box {
        flex: 1 1 400px;
        padding: 40px;
      }

      .form-box {
        display: flex;
        flex-direction: column;
        justify-content: center;
        background-color: rgba(255, 255, 255, 0.08);
      }

      .form-box h1 {
        font-size: 32px;
        margin-bottom: 10px;
        font-weight: 700;
        color: #ffffff;
      }

      .form-box h2 {
        margin-bottom: 20px;
        font-weight: 500;
        font-size: 20px;
        color: #c8e6c9;
      }

      .form-box p.error-message {
        color: pink;
        margin-bottom: 20px;
      }

      .form-group {
        position: relative;
        margin-bottom: 30px;
      }

      .form-group input {
        width: 100%;
        padding: 12px 10px;
        border: none;
        border-bottom: 2px solid #ccc;
        background: transparent;
        color: #fff;
        font-size: 16px;
        outline: none;
        transition: border-color 0.3s;
      }

      .form-group label {
        position: absolute;
        top: 12px;
        left: 10px;
        color: #ccc;
        pointer-events: none;
        transition: 0.3s;
      }

      .form-group input:focus {
        border-color: #a5d6a7;
      }

      .form-group input:focus + label,
      .form-group input:not(:placeholder-shown) + label {
        top: -10px;
        font-size: 12px;
        color: #a5d6a7;
      }

      .btn-login {
        width: 100%;
        padding: 12px;
        background: #66bb6a;
        color: #fff;
        font-size: 16px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.3s;
      }

      .btn-login:hover {
        background: #57a05d;
      }

      .forgot-link {
        display: block;
        margin-top: 12px;
        text-align: right;
        color: #ddd;
        font-size: 14px;
        text-decoration: none;
      }

      .forgot-link:hover {
        color: #ffffff;
        text-decoration: underline;
      }

      .map-box {
        padding: 0;
        min-height: 350px;
      }

      .map-box iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
      }

      @media (max-width: 900px) {
        .container {
          flex-direction: column;
        }

        .map-box {
          min-height: 300px;
        }

        .form-box {
          padding: 30px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Login and Forgot Password Form Section -->
      <div class="form-box">
        <h1>BMC</h1>
        <h2>Berhampur Municipal Corporation Login</h2>

        <!-- 🔴 Error message from Flask -->
        {% if error %}
        <p class="error-message">{{ error }}</p>
        {% endif %}

        <!-- ✅ Login Form (POST to Flask) -->
        <form id="loginForm" method="POST" action="/login">
          <div class="form-group">
            <input
              type="text"
              id="userId"
              name="userid"
              required
              placeholder=" "
            />
            <label for="userId">User ID</label>
          </div>
          <div class="form-group">
            <input
              type="password"
              id="password"
              name="password"
              required
              placeholder=" "
            />
            <label for="password">Password</label>
          </div>
          <button type="submit" class="btn-login">Login</button>
          <a href="#" class="forgot-link" onclick="showForgotForm()"
            >Forgot Password?</a
          >
        </form>

        <!-- Forgot Password Form (Initially Hidden) -->
        <form id="forgotForm" style="display: none">
          <div class="form-group">
            <input type="email" id="forgotEmail" placeholder=" " required />
            <label for="forgotEmail">Enter your registered email</label>
          </div>
          <button type="submit" class="btn-login">Send Reset Link</button>
          <a href="#" class="forgot-link" onclick="showLoginForm()"
            >← Back to Login</a
          >
          <div
            id="forgotMessage"
            class="forgot-link"
            style="margin-top: 12px; text-align: left"
          ></div>
        </form>
      </div>

      <!-- Google Map Section -->
      <div class="map-box">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3790.4449250318295!2d84.79624801487004!3d19.314961586942732!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3a3bc5390f7a87c9%3A0xe9a2f860c6e7b4fc!2sBerhampur%20Municipal%20Corporation!5e0!3m2!1sen!2sin!4v1623318487955!5m2!1sen!2sin"
          allowfullscreen=""
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
        >
        </iframe>
      </div>
    </div>

    <script>
      // Show/Hide Forms
      function showForgotForm() {
        document.getElementById("loginForm").style.display = "none";
        document.getElementById("forgotForm").style.display = "block";
      }

      function showLoginForm() {
        document.getElementById("forgotForm").style.display = "none";
        document.getElementById("loginForm").style.display = "block";
        document.getElementById("forgotMessage").textContent = "";
      }

      // Handle Forgot Password
      document
        .getElementById("forgotForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          const email = document.getElementById("forgotEmail").value.trim();
          const message = document.getElementById("forgotMessage");

          if (!validateEmail(email)) {
            message.style.color = "red";
            message.textContent = "Please enter a valid email address.";
            return;
          }

          message.style.color = "lightgreen";
          message.textContent =
            "If this email is registered, a reset link has been sent.";
        });

      function validateEmail(email) {
        const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return re.test(email.toLowerCase());
      }
    </script>
  </body>
</html>
